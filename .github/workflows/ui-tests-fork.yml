name: UI Tests fork exemption

# Fork pull requests cannot read CHROMATIC_CYBERSTORM_TOKEN, and the
# pull_request token cannot write commit statuses, so Chromatic never posts
# its checks. Those checks are exactly "UI Tests: cyberstorm" and
# "UI Review: cyberstorm". A status named "UI Tests" does not satisfy them.
#
# pull_request_target runs this file from the base branch and can write
# statuses for forks. Do not check out the pull request head, and do not read
# secrets other than GITHUB_TOKEN. Executing fork code here would expose the
# write token.

on:
  pull_request_target:

permissions: {}

jobs:
  pass-ui-tests:
    name: pass-ui-tests
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark UI Tests successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for context in "UI Tests: cyberstorm" "UI Review: cyberstorm"; do
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=success \
              -f "context=${context}" \
              -f "description=Skipped: fork PR has no Chromatic token. Visual changes are not reviewed." \
              -f "target_url=${TARGET_URL}"
          done
